[package]
name = "audiobox-device"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Jose Sanchez <jose.sansan@proton.me>"]
description = "Plays audiobox's real-time mixer on the audio device, natively through cpal, and keeps it playing when the device changes"
license = "MIT"
repository = "https://github.com/jmsansan/audiobox-device"
documentation = "https://docs.rs/audiobox-device"
readme = "README.md"
keywords = ["audio", "gamedev", "cpal", "mixer", "audiobox"]
categories = ["multimedia::audio", "game-development"]

[dependencies]
audiobox = { version = "0.2.1", features = ["mixer"] }
cpal = "0.18.2"

[dev-dependencies]
audiobox = { version = "0.2.1", features = ["mixer", "synth", "sfx"] }

